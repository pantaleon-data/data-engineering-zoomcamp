services:
  pgdatabase:
    image: postgres:15
    container_name: pgdatabase
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: ny_taxi
    ports:
      - "5432:5432"
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql/data
    depends_on:
      kestra:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:8.3
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8085:80"
    depends_on:
      pgdatabase:
        condition: service_started
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  kestra_postgres:
    image: postgres:15
    container_name: kestra_postgres
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data

  kestra:
    image: kestra/kestra:v2.0-slim
    pull_policy: always
    container_name: kestra
    user: "root"
    command: server standalone
    environment:
      SECRET_POSTGRES_USERNAME: "cm9vdA=="
      SECRET_POSTGRES_PASSWORD: "cm9vdA=="

      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        SECRET_POSTGRES_USERNAME: cm9vdA==
        SECRET_POSTGRES_PASSWORD: cm9vdA==


        kestra:
          server:
            basicAuth:
              username: "admin@kestra.io"
              password: "Admin1234!"
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: "/tmp/kestra-wd/tmp"
          url: http://localhost:8080/

    ports:
      - "8080:8080"
    volumes:
      - kestra_data:/app/storage
      - kestra_tmp:/tmp/kestra-wd/tmp
    depends_on:
      kestra_postgres:
        condition: service_started

volumes:
  ny_taxi_postgres_data:
  pgadmin_data:
  kestra_postgres_data:
  kestra_data:
  kestra_tmp: